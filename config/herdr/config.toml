# Herdr keybindings inspired by Omarchy tmux:
# https://learn.omacom.io/2/the-omarchy-manual/53/hotkeys#tmux
#
# Split of responsibility:
# - Native Herdr keys own panes/tabs/workspaces (Omarchy session/window analogs)
# - Dev-layout plugin owns the sticky-agent layout
# - herdr-worktrunk owns git worktree pickers (not workspace close)
#
# Worktree paths: Worktrunk keeps sibling checkouts (<repo>.<branch> next to main).
# Herdr groups those as child workspaces via `herdr worktree open|create --path`
# (see worktrunk herdr-layout.sh) — not by relocating under ~/.herdr/worktrees.

onboarding = false

[theme]
name = "gruvbox"
auto_switch = true
light_name = "gruvbox-light"
dark_name = "gruvbox"

[terminal]
new_cwd = "follow"
# Unset default_shell: Herdr uses $SHELL (bash on typical Linux, zsh on macOS).
# Forcing bash makes macOS print "update your account to use zsh" in every pane.
shell_mode = "auto"

[keys]
prefix = "ctrl+space"

# Workspaces ≈ Omarchy tmux sessions (Alt+Up/Down)
previous_workspace = "alt+up"
next_workspace = "alt+down"
workspace_picker = "prefix+w"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+k"
detach = "prefix+shift+q"

# Tabs ≈ Omarchy tmux windows
new_tab = "prefix+c"
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
close_tab = "prefix+k"
rename_tab = "prefix+shift+t"

# Panes — Omarchy uses Ctrl+Alt+Arrows; we use vim keys (fcitx5-safe on Omarchy)
split_vertical = "prefix+h"
split_horizontal = "prefix+v"
close_pane = "prefix+x"
zoom = "prefix+z"
focus_pane_left = "ctrl+alt+h"
focus_pane_down = "ctrl+alt+j"
focus_pane_up = "ctrl+alt+k"
focus_pane_right = "ctrl+alt+l"

# Native Herdr new_worktree (prefix+shift+g) is replaced by worktrunk.open below.
new_worktree = ""

[[keys.command]]
key = "prefix+q"
type = "shell"
command = "herdr server reload-config"
description = "Reload config"

# --- Dev layout (sticky agent) ---
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "agentic-dev.dev-layout.apply"
description = "Apply dev layout"

[[keys.command]]
key = "prefix+1"
type = "plugin_action"
command = "agentic-dev.dev-layout.focus_agent"
description = "Focus agent pane"

[[keys.command]]
key = "prefix+2"
type = "plugin_action"
command = "agentic-dev.dev-layout.select_review"
description = "Review tab"

[[keys.command]]
key = "prefix+3"
type = "plugin_action"
command = "agentic-dev.dev-layout.select_explorer"
description = "Explorer tab"

[[keys.command]]
key = "prefix+4"
type = "plugin_action"
command = "agentic-dev.dev-layout.select_terminal"
description = "Terminal tab"

[[keys.command]]
key = "alt+1"
type = "plugin_action"
command = "agentic-dev.dev-layout.alt_review"
description = "Review tab, or first tab outside dev workspaces"

[[keys.command]]
key = "alt+2"
type = "plugin_action"
command = "agentic-dev.dev-layout.alt_explorer"
description = "Explorer tab, or second tab outside dev workspaces"

[[keys.command]]
key = "alt+3"
type = "plugin_action"
command = "agentic-dev.dev-layout.alt_terminal"
description = "Terminal tab, or third tab outside dev workspaces"

# --- Git worktrees (herdr-worktrunk plugin) ---
# Intentionally replaces Herdr's basic new_worktree with the fzf picker.
# close_workspace stays native on prefix+shift+k (Omarchy kill-session analog).
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch / create from current branch"

[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"
