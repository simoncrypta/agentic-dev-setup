[pre-start]
copy-ignored = "wt step copy-ignored"

[post-start]
herdr = """
S="{{ branch | capitalize }}_{{ repo | capitalize }}"
W="{{ worktree_path }}"

source "$HOME/.config/worktrunk/herdr-layout.sh"
# Layout only — never inherit a handoff prompt from the parent agent shell.
unset WT_HERDR_AGENT_PROMPT
wt_herdr_layout_create "$S" "$W"

echo "✓ Herdr worktree group / subspace '$S' ready"
echo "  Layout: agent pane | review/shell center | files pane"
echo "  Switch: prefix+1 agent, +2 review, +3 shell, +b/+e files, +g git"
echo "  Attach with: herdr"
"""

[post-remove]
herdr = """
S="{{ branch | capitalize }}_{{ repo | capitalize }}"
source "$HOME/.config/worktrunk/herdr-layout.sh"
wt_herdr_layout_close "$S"
"""
