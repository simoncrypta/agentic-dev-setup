name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --all
      - name: cargo build release
        run: cargo build --release -p herdr-sidebar
      - name: shellcheck
        run: |
          shellcheck -x layout.sh config-reader.sh tests/*.sh
      - name: manifest parse
        run: grep -q 'id = "agentic-dev.layout"' herdr-plugin.toml
      - name: layout tests
        run: |
          bash tests/state_test.sh
          bash tests/topology_test.sh
          bash tests/open_editor_test.sh
